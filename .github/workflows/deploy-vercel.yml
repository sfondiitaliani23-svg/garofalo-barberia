name: Deploy su Vercel

# Pubblica il sito in produzione a ogni push su main.
# La build gira sui server Vercel, che hanno la cache di node_modules e .next:
# qui si caricano solo i file cambiati (confronto per hash).
# Secret richiesti (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Controllo configurazione
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Mancano i secret:$missing. Aggiungili in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Cache Vercel CLI
        id: cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.vercel-cli
          key: vercel-cli-${{ runner.os }}-v1

      - name: Installa Vercel CLI
        if: steps.cli-cache.outputs.cache-hit != 'true'
        run: npm install --prefix ~/.vercel-cli vercel@latest --no-audit --no-fund

      - name: Pubblica in produzione
        run: |
          url=$(~/.vercel-cli/node_modules/.bin/vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "Pubblicato: $url"
          echo "### ✅ Sito pubblicato" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
