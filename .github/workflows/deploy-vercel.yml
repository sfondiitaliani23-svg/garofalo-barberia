name: Deploy su Vercel

# Pubblica il sito in produzione a ogni push su main.
# Serve una sola configurazione iniziale: 3 secret nel repo GitHub
# (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       → token creato su vercel.com/account/tokens
#   VERCEL_ORG_ID      → "orgId" del file .vercel/project.json sul PC
#   VERCEL_PROJECT_ID  → "projectId" dello stesso file

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Controllo configurazione
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Mancano i secret:$missing. Aggiungili in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa Vercel CLI
        run: npm install --global vercel@latest

      - name: Scarica impostazioni e variabili d'ambiente di produzione
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Pubblica in produzione
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Pubblicato: $url"
          echo "### ✅ Sito pubblicato" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
