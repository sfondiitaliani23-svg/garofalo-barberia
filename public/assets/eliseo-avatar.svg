<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Eliseo, assistente virtuale">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#f0d68e"/>
      <stop offset="0.55" stop-color="#d9b25c"/>
      <stop offset="1" stop-color="#b8933f"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c4a0"/>
      <stop offset="1" stop-color="#e3a985"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2c24"/>
      <stop offset="1" stop-color="#c9a487" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="round"><circle cx="128" cy="128" r="128"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="256" height="256" fill="url(#bg)"/>

    <!-- giacca e maglietta nere -->
    <path d="M28 256 C34 214 62 196 98 188 L128 206 L158 188 C194 196 222 214 228 256 Z" fill="#141210"/>
    <path d="M98 188 L128 236 L158 188 L146 184 L128 204 L110 184 Z" fill="#050505"/>
    <path d="M98 188 L112 230 L92 256 L70 256 L84 210 Z" fill="#1f1c19"/>
    <path d="M158 188 L144 230 L164 256 L186 256 L172 210 Z" fill="#1f1c19"/>
    <path d="M190 226 l14 -3" stroke="#e9e4da" stroke-width="3" stroke-linecap="round"/>

    <!-- collo -->
    <path d="M108 160 L108 190 Q128 206 148 190 L148 160 Z" fill="#dda07c"/>
    <path d="M108 176 Q128 192 148 176 L148 186 Q128 200 108 186 Z" fill="#c98c6a" opacity="0.6"/>

    <!-- catenina -->
    <path d="M108 190 Q128 214 150 190" fill="none" stroke="#d8d4cc" stroke-width="1.8" stroke-dasharray="3 2.5" stroke-linecap="round"/>

    <!-- calotta dei capelli dietro il viso: niente buchi tra capelli e fronte -->
    <path d="M86 100 C82 60 104 40 128 40 C152 40 174 60 170 100 Z" fill="#2c211b"/>

    <!-- orecchie -->
    <ellipse cx="80" cy="118" rx="10" ry="15" fill="#e8ad88"/>
    <ellipse cx="176" cy="118" rx="10" ry="15" fill="#e8ad88"/>
    <path d="M80 110 q-4 8 0 16" stroke="#c98c6a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M176 110 q4 8 0 16" stroke="#c98c6a" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- viso -->
    <path d="M86 100 C86 74 170 74 170 100 L170 126 C170 150 156 172 128 176 C100 172 86 150 86 126 Z" fill="url(#skin)"/>

    <!-- capelli: sfumatura alta ai lati, sopra pettinati all'indietro -->
    <path d="M86 106 C83 90 85 78 92 70 L94 84 C90 90 90 98 92 106 Z" fill="url(#fade)"/>
    <path d="M170 106 C173 90 171 78 164 70 L162 84 C166 90 166 98 164 106 Z" fill="url(#fade)"/>
    <path d="M88 82 C82 52 104 30 132 30 C160 30 180 46 170 84 C168 72 160 64 148 62 C132 58 118 66 104 64 C96 66 90 72 88 82 Z" fill="#241a15"/>
    <path d="M96 60 C108 44 132 38 154 44" stroke="#4a3a30" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M104 54 C122 46 146 46 162 56" stroke="#3d2e26" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <!-- sopracciglia folte -->
    <path d="M96 100 C104 93 116 93 122 98" stroke="#2a1d17" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M134 98 C140 93 152 93 160 100" stroke="#2a1d17" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- occhi castani, sorridenti -->
    <ellipse cx="109" cy="113" rx="8.5" ry="6.5" fill="#fff"/>
    <ellipse cx="147" cy="113" rx="8.5" ry="6.5" fill="#fff"/>
    <circle cx="110" cy="113" r="5" fill="#6b4226"/>
    <circle cx="146" cy="113" r="5" fill="#6b4226"/>
    <circle cx="110" cy="113" r="2.4" fill="#1a110c"/>
    <circle cx="146" cy="113" r="2.4" fill="#1a110c"/>
    <circle cx="111.6" cy="111.3" r="1.3" fill="#fff"/>
    <circle cx="147.6" cy="111.3" r="1.3" fill="#fff"/>
    <path d="M100 113 Q109 104 118 113" stroke="#2a1d17" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M138 113 Q147 104 156 113" stroke="#2a1d17" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M102 120 Q109 123 116 120" stroke="#c98c6a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M140 120 Q147 123 154 120" stroke="#c98c6a" stroke-width="1.6" fill="none" stroke-linecap="round"/>

    <!-- naso -->
    <path d="M128 116 C126 128 122 136 126 140 Q130 142 134 139" stroke="#c4825f" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <!-- guance -->
    <ellipse cx="100" cy="138" rx="9" ry="5" fill="#e98f7a" opacity="0.35"/>
    <ellipse cx="156" cy="138" rx="9" ry="5" fill="#e98f7a" opacity="0.35"/>

    <!-- barba appena accennata -->
    <path d="M92 138 C96 166 112 176 128 176 C144 176 160 166 164 138 C158 156 146 166 128 166 C110 166 98 156 92 138 Z" fill="#6b5244" opacity="0.18"/>

    <!-- sorriso -->
    <path d="M110 148 Q128 166 146 148 Q128 158 110 148 Z" fill="#7a2e26"/>
    <path d="M113 149.5 Q128 156 143 149.5 L142 152 Q128 157 114 152 Z" fill="#fff"/>
    <path d="M110 148 Q128 166 146 148" stroke="#8a4a3a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M106 146 q2 3 5 3" stroke="#c4825f" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M150 146 q-2 3 -5 3" stroke="#c4825f" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <circle cx="128" cy="128" r="126" fill="none" stroke="#1a140c" stroke-width="4"/>
</svg>
